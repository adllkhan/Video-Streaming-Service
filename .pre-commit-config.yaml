repos:
  - repo: local
    hooks:
      - id: ruff-linter
        name: ruff-linter
        entry: ruff
        language: system
        types: [python]
        args: [check, --fix]
      - id: ruff-formatter
        name: ruff-formatter
        entry: ruff
        language: system
        types: [python]
        args: [format]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
